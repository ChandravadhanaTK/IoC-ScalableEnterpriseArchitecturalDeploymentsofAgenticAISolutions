# Event worker. Scaled on the outbox backlog it exports (copilot_event_backlog),
# because CPU says nothing about how much asynchronous work is waiting.
# The scaler is a KEDA ScaledObject reading Prometheus (50-keda-scaledobject.yaml);
# on a cluster without KEDA the Deployment simply runs at one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-worker
  namespace: opscopilot
  labels: { app: copilot-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: copilot-worker }
  template:
    metadata:
      labels: { app: copilot-worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      serviceAccountName: copilot
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: opscopilot:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          command: ["python", "-m", "opscopilot.worker"]
          ports: [{ containerPort: 9100, name: metrics }]
          envFrom:
            - configMapRef: { name: copilot-config }
          env:
            - { name: METRICS_PORT, value: "9100" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          # A worker is healthy if its metrics endpoint answers; it has no HTTP API.
          livenessProbe:
            httpGet: { path: /, port: metrics }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: metrics }
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: copilot-data }
        - name: tmp
          emptyDir: {}

# The copilot API. Readiness checks the DB and Ollama, so a pod that cannot
# reach the model never receives traffic. Liveness is the cheap /healthz.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-api
  namespace: opscopilot
  labels: { app: copilot-api }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: copilot-api }
  template:
    metadata:
      labels: { app: copilot-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: copilot
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # Long enough for one in-flight request (up to 6 model calls) to finish
      # before SIGKILL; a checkpointed request survives anyway.
      terminationGracePeriodSeconds: 300
      containers:
        - name: api
          image: opscopilot:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: copilot-config }
            - secretRef: { name: copilot-secrets }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: copilot-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: copilot-api
  namespace: opscopilot
spec:
  type: NodePort
  selector: { app: copilot-api }
  ports: [{ port: 8000, targetPort: http, nodePort: 30080 }]
---
# The API is I/O bound on the model, so CPU is a weak signal; it is here because
# it works with only metrics-server installed. With a Prometheus adapter the
# right target is in-flight requests per pod (a metric this build does not yet export), and
# more replicas only help once the model endpoint itself is scaled.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: copilot-api
  namespace: opscopilot
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: copilot-api }
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

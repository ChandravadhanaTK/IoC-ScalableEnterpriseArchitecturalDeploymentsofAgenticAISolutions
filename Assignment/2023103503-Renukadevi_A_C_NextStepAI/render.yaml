services:
  - type: web
    name: nextstep-ai-agent
    runtime: python
    rootDir: .
    buildCommand: "pip install -r backend/requirements.txt && cd client && npm ci && npm run build"
    startCommand: "bash start.sh"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./nextstep.db
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://nextstep-ai-agent.onrender.com

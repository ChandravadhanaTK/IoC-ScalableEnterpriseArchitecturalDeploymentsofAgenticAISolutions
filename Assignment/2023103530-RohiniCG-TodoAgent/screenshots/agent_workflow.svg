<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#0b1120"/>
  <text x="600" y="45" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">DELIVERABLE 2: AGENT WORKFLOW &amp; STATE MACHINE</text>
  <text x="600" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Deterministic State Machine, Multi-Agent Roles, HITL Safety Gate &amp; Recovery</text>

  <!-- Step 1 -->
  <rect x="30" y="140" width="145" height="120" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="102" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#c7d2fe" text-anchor="middle">1. INGESTION</text>
  <text x="102" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">NeMo Scanner &amp;</text>
  <text x="102" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Presidio PII Redact</text>

  <!-- Arrow -->
  <path d="M 185 200 L 205 200" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="215" y="140" width="145" height="120" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <text x="287" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#c7d2fe" text-anchor="middle">2. PRIORITIZE</text>
  <text x="287" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Eisenhower Q1-Q4</text>
  <text x="287" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Multi-Factor Weight</text>

  <!-- Arrow -->
  <path d="M 370 200 L 390 200" stroke="#818cf8" stroke-width="2"/>

  <!-- Step 3 -->
  <rect x="400" y="140" width="145" height="120" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
  <text x="472" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e9d5ff" text-anchor="middle">3. DECOMPOSE</text>
  <text x="472" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">LangGraph DAG</text>
  <text x="472" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Atomic Subtasks</text>

  <!-- Arrow -->
  <path d="M 555 200 L 575 200" stroke="#a855f7" stroke-width="2"/>

  <!-- Step 4 HITL Gate -->
  <rect x="585" y="140" width="150" height="120" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="660" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fde68a" text-anchor="middle">4. HITL GATE</text>
  <text x="660" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">P0 Critical &amp;</text>
  <text x="660" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Restricted Sign-off</text>

  <!-- Arrow -->
  <path d="M 745 200 L 765 200" stroke="#f59e0b" stroke-width="2"/>

  <!-- Step 5 Sandbox Exec -->
  <rect x="775" y="140" width="145" height="120" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="2"/>
  <text x="847" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbcfe8" text-anchor="middle">5. EXECUTE</text>
  <text x="847" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">MicroVM Sandbox</text>
  <text x="847" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">eBPF Seccomp</text>

  <!-- Arrow -->
  <path d="M 930 200 L 950 200" stroke="#ec4899" stroke-width="2"/>

  <!-- Step 6 Critic Reflection -->
  <rect x="960" y="140" width="105" height="120" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="1012" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0" text-anchor="middle">6. CRITIC</text>
  <text x="1012" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">Reflect &amp;</text>
  <text x="1012" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">Validate</text>

  <!-- Arrow -->
  <path d="M 1075 200 L 1090 200" stroke="#10b981" stroke-width="2"/>

  <!-- Step 7 Audit -->
  <rect x="1100" y="140" width="80" height="120" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <text x="1140" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#67e8f9" text-anchor="middle">7. AUDIT</text>
  <text x="1140" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#a5f3fc" text-anchor="middle">SHA256</text>
</svg>

apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: servicedesk-data, namespace: servicedesk}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: servicedesk, labels: {app: backend}}
spec:
  # SQLite mode = 1 replica. For horizontal scale set replicas>=3 with the
  # Postgres store + Redis rate limiter described in docs/DELIVERABLES.md section 3.
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: backend}}
  template:
    metadata:
      labels: {app: backend}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/your-org/servicedesk-backend:1.0.0
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - configMapRef: {name: servicedesk-config}
            - secretRef: {name: servicedesk-secrets}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, failureThreshold: 3}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3, failureThreshold: 20}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: servicedesk-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: servicedesk}
spec:
  selector: {app: backend}
  ports: [{port: 8000, targetPort: http, name: http}]

version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: enterprise_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: enterprise_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=enterprise_ai_support
      - DEMO_MODE=true
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=production
      - LLM_PROVIDER=demo
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./data:/app/data      # Persist ChromaDB & policies

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: enterprise_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:

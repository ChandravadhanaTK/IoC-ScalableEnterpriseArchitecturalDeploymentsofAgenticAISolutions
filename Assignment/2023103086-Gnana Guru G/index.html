<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backlog.md - Markdown-native Kanban Board</title>
    <link rel="icon" type="image/png" href="./src/web/favicon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(150, 150, 150, 0.3);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(150, 150, 150, 0.5);
        }
        .markdown-content p { margin-bottom: 0.75rem; }
        .markdown-content ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-content ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-content code { background: rgba(120, 120, 120, 0.15); padding: 0.15rem 0.3rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.875em; }
        .markdown-content pre { background: rgba(0, 0, 0, 0.2); padding: 0.75rem; border-radius: 0.375rem; overflow-x: auto; margin-bottom: 0.75rem; }
        .markdown-content a { color: #8b5cf6; text-decoration: underline; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Navbar -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/80 sticky top-0 z-30 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <!-- Brand -->
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-md font-bold text-white text-lg">
                    📋
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        Backlog.md
                        <span class="text-xs bg-purple-500/20 text-purple-300 font-medium px-2 py-0.5 rounded-full border border-purple-500/30">Static Space</span>
                    </h1>
                </div>
            </div>

            <!-- Search & Filters -->
            <div class="flex-1 max-w-md mx-2">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Search tasks by ID, title, or label..." 
                           class="w-full bg-slate-950/60 border border-slate-700 rounded-lg px-3 py-1.5 pl-9 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                    <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center space-x-2">
                <button onclick="openCreateModal()" class="bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium px-3.5 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    New Task
                </button>
                <button onclick="openStatsModal()" title="View Statistics" class="p-2 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg transition">
                    📊
                </button>
                <button onclick="exportData()" title="Export JSON" class="p-2 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg transition">
                    💾
                </button>
            </div>
        </div>
    </header>

    <!-- Filter Bar -->
    <div class="bg-slate-800/40 border-b border-slate-700/50 px-4 py-2">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex items-center flex-wrap gap-2">
                <span class="text-slate-400">Filters:</span>
                <select id="priorityFilter" onchange="renderBoard()" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-300 focus:outline-none focus:border-purple-500">
                    <option value="">All Priorities</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <select id="typeFilter" onchange="renderBoard()" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-300 focus:outline-none focus:border-purple-500">
                    <option value="">All Types</option>
                    <option value="feature">Feature</option>
                    <option value="bug">Bug</option>
                    <option value="enhancement">Enhancement</option>
                    <option value="task">Task</option>
                </select>
                <button onclick="resetFilters()" class="text-purple-400 hover:text-purple-300 px-1 py-0.5">Clear</button>
            </div>
            <div class="text-slate-400" id="taskCountSummary">
                Loading tasks...
            </div>
        </div>
    </div>

    <!-- Board Area -->
    <main class="flex-1 p-4 overflow-x-auto custom-scrollbar">
        <div class="max-w-7xl mx-auto min-w-[900px] grid grid-cols-4 gap-4 h-[calc(100vh-140px)]">
            
            <!-- Column: To Do -->
            <div class="flex flex-col bg-slate-800/60 rounded-xl border border-slate-700/70 overflow-hidden shadow-sm">
                <div class="p-3 border-b border-slate-700/70 bg-slate-800/90 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                        <h2 class="font-semibold text-sm text-slate-200">To Do</h2>
                    </div>
                    <span id="count-todo" class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full font-mono">0</span>
                </div>
                <div id="col-todo" class="flex-1 p-3 overflow-y-auto space-y-3 custom-scrollbar" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'To Do')"></div>
            </div>

            <!-- Column: In Progress -->
            <div class="flex flex-col bg-slate-800/60 rounded-xl border border-slate-700/70 overflow-hidden shadow-sm">
                <div class="p-3 border-b border-slate-700/70 bg-slate-800/90 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                        <h2 class="font-semibold text-sm text-slate-200">In Progress</h2>
                    </div>
                    <span id="count-in-progress" class="text-xs bg-amber-950/60 text-amber-300 border border-amber-800/40 px-2 py-0.5 rounded-full font-mono">0</span>
                </div>
                <div id="col-in-progress" class="flex-1 p-3 overflow-y-auto space-y-3 custom-scrollbar" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'In Progress')"></div>
            </div>

            <!-- Column: Review -->
            <div class="flex flex-col bg-slate-800/60 rounded-xl border border-slate-700/70 overflow-hidden shadow-sm">
                <div class="p-3 border-b border-slate-700/70 bg-slate-800/90 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-400"></span>
                        <h2 class="font-semibold text-sm text-slate-200">In Review</h2>
                    </div>
                    <span id="count-review" class="text-xs bg-blue-950/60 text-blue-300 border border-blue-800/40 px-2 py-0.5 rounded-full font-mono">0</span>
                </div>
                <div id="col-review" class="flex-1 p-3 overflow-y-auto space-y-3 custom-scrollbar" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'Review')"></div>
            </div>

            <!-- Column: Done -->
            <div class="flex flex-col bg-slate-800/60 rounded-xl border border-slate-700/70 overflow-hidden shadow-sm">
                <div class="p-3 border-b border-slate-700/70 bg-slate-800/90 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                        <h2 class="font-semibold text-sm text-slate-200">Done</h2>
                    </div>
                    <span id="count-done" class="text-xs bg-emerald-950/60 text-emerald-300 border border-emerald-800/40 px-2 py-0.5 rounded-full font-mono">0</span>
                </div>
                <div id="col-done" class="flex-1 p-3 overflow-y-auto space-y-3 custom-scrollbar" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'Done')"></div>
            </div>

        </div>
    </main>

    <!-- Task Detail Modal -->
    <div id="detailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-850">
                <div class="flex items-center gap-3">
                    <span id="modalTaskId" class="font-mono text-xs font-bold text-purple-400 bg-purple-950/60 border border-purple-800/60 px-2.5 py-1 rounded"></span>
                    <span id="modalTaskStatusBadge" class="text-xs px-2 py-0.5 rounded font-medium"></span>
                </div>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white p-1 rounded hover:bg-slate-800">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-6 overflow-y-auto space-y-5 custom-scrollbar text-sm text-slate-200 flex-1">
                <h2 id="modalTaskTitle" class="text-xl font-bold text-white tracking-tight"></h2>

                <!-- Metadata Row -->
                <div class="grid grid-cols-3 gap-3 p-3 bg-slate-800/50 rounded-lg border border-slate-700/60 text-xs">
                    <div>
                        <span class="text-slate-400 block mb-1">Status</span>
                        <select id="modalStatusSelect" onchange="updateModalTaskStatus()" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 w-full focus:outline-none focus:border-purple-500">
                            <option value="To Do">To Do</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Review">Review</option>
                            <option value="Done">Done</option>
                        </select>
                    </div>
                    <div>
                        <span class="text-slate-400 block mb-1">Priority</span>
                        <span id="modalTaskPriority" class="font-medium"></span>
                    </div>
                    <div>
                        <span class="text-slate-400 block mb-1">Assignee</span>
                        <span id="modalTaskAssignee" class="font-medium text-slate-300"></span>
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <h3 class="font-semibold text-slate-300 text-xs uppercase tracking-wider mb-2">Description</h3>
                    <div id="modalTaskDescription" class="markdown-content p-3 bg-slate-950/40 rounded-lg border border-slate-800"></div>
                </div>

                <!-- Acceptance Criteria -->
                <div id="modalAcSection">
                    <h3 class="font-semibold text-slate-300 text-xs uppercase tracking-wider mb-2 flex items-center justify-between">
                        <span>Acceptance Criteria</span>
                        <span id="modalAcProgress" class="text-purple-400 font-mono"></span>
                    </h3>
                    <div id="modalAcList" class="space-y-2"></div>
                </div>

                <!-- Definition of Done -->
                <div id="modalDodSection">
                    <h3 class="font-semibold text-slate-300 text-xs uppercase tracking-wider mb-2">Definition of Done</h3>
                    <div id="modalDodList" class="space-y-2"></div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-slate-800 bg-slate-850 flex justify-between items-center">
                <button onclick="deleteCurrentTask()" class="text-red-400 hover:text-red-300 text-xs px-3 py-1.5 rounded hover:bg-red-950/30">Delete Task</button>
                <button onclick="closeDetailModal()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-4 py-2 rounded-lg">Close</button>
            </div>
        </div>
    </div>

    <!-- Create Task Modal -->
    <div id="createModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-xl w-full flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <h2 class="font-bold text-base text-white">Create New Task</h2>
                <button onclick="closeCreateModal()" class="text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <form onsubmit="handleCreateTaskSubmit(event)" class="p-5 space-y-4 text-sm">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Title *</label>
                    <input type="text" id="newTitle" required placeholder="e.g. Implement feature" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Status</label>
                        <select id="newStatus" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                            <option value="To Do">To Do</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Review">Review</option>
                            <option value="Done">Done</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Priority</label>
                        <select id="newPriority" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Labels (comma-separated)</label>
                    <input type="text" id="newLabels" placeholder="e.g. frontend, ui" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Description</label>
                    <textarea id="newDescription" rows="3" placeholder="Details about this task..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onclick="closeCreateModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white font-medium rounded-lg text-xs">Create Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Statistics Modal -->
    <div id="statsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-bold text-base text-white">Board Statistics</h2>
                <button onclick="closeStatsModal()" class="text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="space-y-3 text-sm">
                <div class="flex justify-between p-2.5 bg-slate-800/60 rounded-lg">
                    <span class="text-slate-400">Total Tasks:</span>
                    <span id="statTotal" class="font-bold text-white">0</span>
                </div>
                <div class="flex justify-between p-2.5 bg-slate-800/60 rounded-lg">
                    <span class="text-slate-400">Completion Rate:</span>
                    <span id="statRate" class="font-bold text-emerald-400">0%</span>
                </div>
                <div class="flex justify-between p-2.5 bg-slate-800/60 rounded-lg">
                    <span class="text-slate-400">High Priority:</span>
                    <span id="statHigh" class="font-bold text-rose-400">0</span>
                </div>
            </div>
            <button onclick="closeStatsModal()" class="mt-5 w-full bg-slate-800 hover:bg-slate-700 text-white py-2 rounded-lg text-xs">Close</button>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let tasks = [];
        let activeTaskId = null;
        let draggedTaskId = null;

        const STORAGE_KEY = 'backlog_tasks_data';

        async function init() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    tasks = JSON.parse(saved);
                    renderBoard();
                    return;
                } catch(e) {}
            }

            try {
                const res = await fetch('./tasks-data.json');
                if (res.ok) {
                    tasks = await res.json();
                    saveTasks();
                    renderBoard();
                }
            } catch (err) {
                console.error('Failed to load initial tasks:', err);
            }
        }

        function saveTasks() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            } catch(e) {
                console.warn('LocalStorage limit reached');
            }
        }

        function getFilteredTasks() {
            const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            const priority = document.getElementById('priorityFilter').value;
            const type = document.getElementById('typeFilter').value;

            return tasks.filter(task => {
                if (priority && (task.priority || '').toLowerCase() !== priority.toLowerCase()) return false;
                if (type && (task.type || '').toLowerCase() !== type.toLowerCase()) return false;
                if (search) {
                    const matchId = (task.id || '').toLowerCase().includes(search);
                    const matchTitle = (task.title || '').toLowerCase().includes(search);
                    const matchLabels = (task.labels || []).some(l => l.toLowerCase().includes(search));
                    if (!matchId && !matchTitle && !matchLabels) return false;
                }
                return true;
            });
        }

        function renderBoard() {
            const filtered = getFilteredTasks();
            
            const cols = {
                'To Do': document.getElementById('col-todo'),
                'In Progress': document.getElementById('col-in-progress'),
                'Review': document.getElementById('col-review'),
                'Done': document.getElementById('col-done')
            };

            const counts = { 'To Do': 0, 'In Progress': 0, 'Review': 0, 'Done': 0 };

            Object.values(cols).forEach(col => col.innerHTML = '');

            filtered.forEach(task => {
                let status = task.status || 'To Do';
                if (!cols[status]) {
                    if (status.toLowerCase().includes('progress')) status = 'In Progress';
                    else if (status.toLowerCase().includes('review')) status = 'Review';
                    else if (status.toLowerCase().includes('done') || status.toLowerCase().includes('completed')) status = 'Done';
                    else status = 'To Do';
                }

                counts[status] = (counts[status] || 0) + 1;

                const card = document.createElement('div');
                card.draggable = true;
                card.ondragstart = (e) => handleDragStart(e, task.id);
                card.className = "bg-slate-850 hover:bg-slate-800 p-3.5 rounded-lg border border-slate-700/80 shadow-sm cursor-pointer transition space-y-2.5 hover:border-purple-500/50";
                card.onclick = () => openDetailModal(task.id);

                // Priority Badge Color
                let priorityClass = "bg-slate-800 text-slate-400";
                if (task.priority === 'high') priorityClass = "bg-rose-950/60 text-rose-300 border border-rose-800/40";
                else if (task.priority === 'medium') priorityClass = "bg-amber-950/60 text-amber-300 border border-amber-800/40";
                else if (task.priority === 'low') priorityClass = "bg-emerald-950/60 text-emerald-300 border border-emerald-800/40";

                // AC Progress calculation
                const acTotal = task.acceptanceCriteriaItems ? task.acceptanceCriteriaItems.length : 0;
                const acChecked = acTotal ? task.acceptanceCriteriaItems.filter(i => i.checked).length : 0;
                const acBadge = acTotal > 0 ? `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-purple-950/50 text-purple-300 border border-purple-800/40">AC: ${acChecked}/${acTotal}</span>` : '';

                // Labels HTML
                const labelsHtml = (task.labels || []).slice(0, 3).map(l => `<span class="text-[10px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded">${l}</span>`).join(' ');

                card.innerHTML = `
                    <div class="flex items-center justify-between text-xs">
                        <span class="font-mono text-purple-400 font-semibold">${task.id}</span>
                        <div class="flex items-center gap-1.5">
                            <span class="text-[10px] uppercase font-medium px-1.5 py-0.5 rounded ${priorityClass}">${task.priority || 'medium'}</span>
                        </div>
                    </div>
                    <h3 class="font-medium text-xs text-slate-100 leading-snug line-clamp-2">${escapeHtml(task.title)}</h3>
                    <div class="flex items-center justify-between pt-1 text-[11px] text-slate-400">
                        <div class="flex items-center gap-1">
                            ${labelsHtml}
                        </div>
                        ${acBadge}
                    </div>
                `;

                cols[status].appendChild(card);
            });

            document.getElementById('count-todo').textContent = counts['To Do'];
            document.getElementById('count-in-progress').textContent = counts['In Progress'];
            document.getElementById('count-review').textContent = counts['Review'];
            document.getElementById('count-done').textContent = counts['Done'];

            document.getElementById('taskCountSummary').textContent = `Showing ${filtered.length} of ${tasks.length} tasks`;
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Drag and Drop
        function handleDragStart(e, id) {
            draggedTaskId = id;
            e.dataTransfer.setData('text/plain', id);
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function handleDrop(e, targetStatus) {
            e.preventDefault();
            const id = draggedTaskId || e.dataTransfer.getData('text/plain');
            if (!id) return;

            const task = tasks.find(t => t.id === id);
            if (task && task.status !== targetStatus) {
                task.status = targetStatus;
                saveTasks();
                renderBoard();
            }
        }

        // Detail Modal
        function openDetailModal(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            activeTaskId = id;

            document.getElementById('modalTaskId').textContent = task.id;
            document.getElementById('modalTaskTitle').textContent = task.title;
            document.getElementById('modalStatusSelect').value = task.status || 'To Do';
            document.getElementById('modalTaskPriority').textContent = (task.priority || 'medium').toUpperCase();
            document.getElementById('modalTaskAssignee').textContent = (task.assignee && task.assignee.length) ? task.assignee.join(', ') : 'Unassigned';

            // Markdown Description
            const descContainer = document.getElementById('modalTaskDescription');
            descContainer.innerHTML = task.description ? marked.parse(task.description) : '<span class="text-slate-500 italic">No description provided.</span>';

            // Acceptance Criteria
            const acList = document.getElementById('modalAcList');
            acList.innerHTML = '';
            const acItems = task.acceptanceCriteriaItems || [];
            if (acItems.length > 0) {
                document.getElementById('modalAcSection').classList.remove('hidden');
                const checkedCount = acItems.filter(i => i.checked).length;
                document.getElementById('modalAcProgress').textContent = `${checkedCount}/${acItems.length} (${Math.round((checkedCount/acItems.length)*100)}%)`;

                acItems.forEach((item, idx) => {
                    const row = document.createElement('label');
                    row.className = "flex items-start gap-2.5 p-2 bg-slate-950/60 hover:bg-slate-950 rounded-lg cursor-pointer transition border border-slate-800";
                    row.innerHTML = `
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleAcItem(${idx}, this.checked)" class="mt-0.5 rounded border-slate-700 text-purple-600 focus:ring-purple-500">
                        <span class="text-xs ${item.checked ? 'line-through text-slate-500' : 'text-slate-200'}">${escapeHtml(item.text)}</span>
                    `;
                    acList.appendChild(row);
                });
            } else {
                document.getElementById('modalAcSection').classList.add('hidden');
            }

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function toggleAcItem(index, checked) {
            const task = tasks.find(t => t.id === activeTaskId);
            if (task && task.acceptanceCriteriaItems && task.acceptanceCriteriaItems[index]) {
                task.acceptanceCriteriaItems[index].checked = checked;
                saveTasks();
                renderBoard();
                openDetailModal(activeTaskId);
            }
        }

        function updateModalTaskStatus() {
            const task = tasks.find(t => t.id === activeTaskId);
            if (task) {
                task.status = document.getElementById('modalStatusSelect').value;
                saveTasks();
                renderBoard();
            }
        }

        function deleteCurrentTask() {
            if (!confirm('Are you sure you want to delete this task?')) return;
            tasks = tasks.filter(t => t.id !== activeTaskId);
            saveTasks();
            renderBoard();
            closeDetailModal();
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // Create Modal
        function openCreateModal() {
            document.getElementById('createModal').classList.remove('hidden');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.add('hidden');
        }

        function handleCreateTaskSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('newTitle').value;
            const status = document.getElementById('newStatus').value;
            const priority = document.getElementById('newPriority').value;
            const labels = document.getElementById('newLabels').value.split(',').map(s => s.trim()).filter(Boolean);
            const description = document.getElementById('newDescription').value;

            const nextNum = tasks.length + 1;
            const newTask = {
                id: `BACK-${nextNum}`,
                title,
                status,
                priority,
                labels,
                description,
                acceptanceCriteriaItems: [],
                createdDate: new Date().toISOString().slice(0, 10)
            };

            tasks.unshift(newTask);
            saveTasks();
            renderBoard();
            closeCreateModal();
        }

        // Stats Modal
        function openStatsModal() {
            const total = tasks.length;
            const done = tasks.filter(t => (t.status || '').toLowerCase() === 'done').length;
            const high = tasks.filter(t => (t.priority || '').toLowerCase() === 'high').length;
            const rate = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statRate').textContent = `${rate}%`;
            document.getElementById('statHigh').textContent = high;

            document.getElementById('statsModal').classList.remove('hidden');
        }

        function closeStatsModal() {
            document.getElementById('statsModal').classList.add('hidden');
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backlog-tasks-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('priorityFilter').value = '';
            document.getElementById('typeFilter').value = '';
            renderBoard();
        }

        document.getElementById('searchInput').addEventListener('input', renderBoard);

        init();
    </script>
</body>
</html>

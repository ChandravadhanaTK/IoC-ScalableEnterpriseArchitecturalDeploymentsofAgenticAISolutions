version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./nextstep.db
      - SECRET_KEY=nextstep-production-secret-key-change-regularly
      - LLM_PROVIDER=mock
      - GEMINI_API_KEY=
      - LLM_MODEL=gemini-3.8-flash
      - FRONTEND_URL=http://localhost:8000
    restart: always

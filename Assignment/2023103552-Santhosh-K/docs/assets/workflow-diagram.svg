<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="ResolveAI agent workflow diagram">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#6de1c4"/></marker><style>.box{fill:#142b4d;stroke:#3d78ba;stroke-width:2}.decision{fill:#2d2864;stroke:#a283f5;stroke-width:2}.human{fill:#503b18;stroke:#f4b947;stroke-width:2}.end{fill:#163e38;stroke:#5addbd;stroke-width:2}.text{font-family:Arial,sans-serif;font-size:19px;font-weight:700;fill:#fff}.small{font-family:Arial,sans-serif;font-size:14px;fill:#b9cde5}.line{stroke:#6de1c4;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1400" height="760" rx="22" fill="#081528"/><text x="55" y="61" class="text" font-size="32">ResolveAI — Controlled Case-Resolution Workflow</text><text x="55" y="90" class="small" font-size="17">Every transition writes a trace; sensitive outcomes stop at a human-controlled gate.</text>
<rect x="555" y="125" width="290" height="70" rx="15" class="box"/><text x="622" y="156" class="text">Customer request</text><text x="597" y="180" class="small">message + validated order ID</text><path d="M700 195V230" class="line"/>
<rect x="555" y="235" width="290" height="70" rx="15" class="box"/><text x="604" y="266" class="text">Query classification</text><text x="604" y="290" class="small">issue type · priority · prompt safety</text><path d="M700 305V340" class="line"/>
<polygon points="700,340 830,400 700,460 570,400" class="decision"/><text x="631" y="397" class="text">Safe and supported?</text><text x="648" y="420" class="small">unknown / injection → route out</text><path d="M830 400H1080V510" class="line"/><text x="910" y="386" class="small">No</text>
<path d="M700 460V495" class="line"/><text x="720" y="480" class="small">Yes</text><rect x="555" y="500" width="290" height="70" rx="15" class="box"/><text x="602" y="531" class="text">Information retrieval</text><text x="596" y="555" class="small">customer-scoped order + policy tools</text><path d="M700 570V605" class="line"/>
<rect x="555" y="610" width="290" height="70" rx="15" class="box"/><text x="619" y="641" class="text">Investigation</text><text x="590" y="665" class="small">ownership · window · evidence · eligibility</text>
<path d="M555 645H310V510" class="line"/><text x="370" y="626" class="small">Needs info</text><rect x="105" y="475" width="210" height="70" rx="15" class="end"/><text x="134" y="506" class="text">Needs information</text><text x="147" y="530" class="small">ask for evidence / order</text>
<path d="M845 645H1080V510" class="line"/><text x="910" y="626" class="small">Conflict / failure</text><rect x="1075" y="475" width="210" height="70" rx="15" class="end"/><text x="1134" y="506" class="text">Escalated</text><text x="1114" y="530" class="small">human specialist review</text>
<path d="M700 680V710" class="line"/><rect x="555" y="710" width="290" height="40" rx="12" class="human"/><text x="592" y="737" class="text">Resolution proposal → approval gate</text>
</svg>

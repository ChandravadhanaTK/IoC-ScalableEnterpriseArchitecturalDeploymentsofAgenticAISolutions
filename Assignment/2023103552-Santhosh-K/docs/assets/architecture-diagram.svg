<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-label="ResolveAI layered enterprise architecture diagram">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#69d7c0"/></marker><style>.t{font-family:Arial,sans-serif;fill:#e8f0fc}.h{font-family:Arial,sans-serif;font-size:25px;font-weight:700;fill:#fff}.s{font-family:Arial,sans-serif;font-size:16px;fill:#b9cbe3}.k{font-family:Arial,sans-serif;font-size:14px;fill:#8ba4c3}.line{stroke:#69d7c0;stroke-width:3;marker-end:url(#a)}.b{fill:#132b4d;stroke:#3677bc;stroke-width:2}.agent{fill:#232653;stroke:#9d7bf8;stroke-width:2}.data{fill:#123b3b;stroke:#4bc4b1;stroke-width:2}</style></defs>
  <rect width="1400" height="780" fill="#081528" rx="22"/><text x="55" y="65" class="h" font-size="34">ResolveAI — Governed Multi-Agent Support Architecture</text><text x="55" y="94" class="s">Trust boundaries, explicit human authority, and observability across every layer</text>
  <rect x="65" y="130" width="1270" height="110" rx="16" class="b"/><text x="100" y="175" class="h">Experience layer</text><text x="100" y="207" class="s">React customer chat · ticket history · support queue · approver workspace · monitoring dashboard</text>
  <line x1="700" y1="240" x2="700" y2="285" class="line"/><rect x="65" y="290" width="1270" height="105" rx="16" class="b"/><text x="100" y="334" class="h">API and control layer</text><text x="100" y="367" class="s">FastAPI REST APIs · request validation · JWT authentication · RBAC · tenant/ownership filter · rate limits</text>
  <line x1="700" y1="395" x2="700" y2="440" class="line"/><rect x="65" y="445" width="1270" height="235" rx="18" fill="#111d3b" stroke="#8e73e8" stroke-width="2"/><text x="100" y="485" class="h">Central workflow orchestrator — bounded state machine</text>
  <rect x="100" y="520" width="190" height="105" rx="12" class="agent"/><text x="130" y="562" class="t" font-size="18" font-weight="700">1. Classifier</text><text x="124" y="592" class="k">intent · safety · priority</text>
  <rect x="325" y="520" width="190" height="105" rx="12" class="agent"/><text x="348" y="562" class="t" font-size="18" font-weight="700">2. Retrieval</text><text x="346" y="592" class="k">order · policy · context</text>
  <rect x="550" y="520" width="190" height="105" rx="12" class="agent"/><text x="565" y="562" class="t" font-size="18" font-weight="700">3. Investigation</text><text x="574" y="592" class="k">eligibility · evidence</text>
  <rect x="775" y="520" width="190" height="105" rx="12" class="agent"/><text x="802" y="562" class="t" font-size="18" font-weight="700">4. Resolution</text><text x="795" y="592" class="k">proposal only · no authority</text>
  <rect x="1000" y="520" width="285" height="105" rx="12" fill="#513916" stroke="#f7ba4d" stroke-width="2"/><text x="1024" y="562" class="t" font-size="18" font-weight="700">Human approval boundary</text><text x="1032" y="592" class="k">refund / replacement / exceptions</text>
  <line x1="700" y1="680" x2="700" y2="720" class="line"/><rect x="65" y="725" width="610" height="38" rx="10" class="data"/><text x="90" y="751" class="t" font-size="16">PostgreSQL + pgvector: tickets, messages, orders, policies, traces, approvals, audit logs</text><rect x="720" y="725" width="615" height="38" rx="10" class="data"/><text x="746" y="751" class="t" font-size="16">Observability: structured logs · metrics · trace IDs · cost and safety events</text>
</svg>
